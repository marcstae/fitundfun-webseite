# Öffnet Pull Requests für Updates; CI prüft sie, gemergt und deployt wird von Hand.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Frisch veröffentlichte Versionen eine Woche liegen lassen (Schutz vor kompromittierten Releases).
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript läuft parallel (README «Wartung»): tsc ist TypeScript 7 (@typescript/native),
      # «typescript» ein Alias auf @typescript/typescript6 für typescript-eslint, bis TS 7.1 eine API hat.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Zurückgestellt, bis die Plugins in eslint-config-next ESLint 10 unterstützen.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
