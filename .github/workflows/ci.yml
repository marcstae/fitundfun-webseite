# Prüft jeden Push auf main und jeden Pull Request, bevor auf dem Server deployt wird.
# Montags zusätzlich, damit neue Sicherheitsmeldungen auch ohne Commit auffallen.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    name: Prüfen und bauen
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions auf Commit-SHA gepinnt; Dependabot hält sie aktuell.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26 # wie node:26-alpine im Dockerfile
          cache: npm
      - run: npm ci --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Sicherheitslücken in Laufzeitpaketen
        run: npm audit --omit=dev
      # Ohne PocketBase und Secrets, wie beim Docker-Build auf dem Server.
      - run: npm run build
      # Schutz vor ungespeicherten Änderungen im echten Browser gegen das echte Next.js: Der
      # Zurück-Knopf-Schutz hängt am Verlaufs-Verhalten von Next.js, ein Update könnte ihn still brechen.
      # E2E=1 nimmt die Testseiten (*.e2e.tsx) in den Build auf; im normalen Build fehlen sie.
      - name: Browser-Test Speicherschutz
        env:
          E2E: "1"
        run: |
          google-chrome --version
          npm run build
          npx next start -p 3100 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3100/e2e/ziel && break; sleep 1; done
          node scripts/e2e-schutz.mjs http://localhost:3100
