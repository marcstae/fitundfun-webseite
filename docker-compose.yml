name: fitundfun-webseite

x-logging: &logging
  driver: json-file
  options:
    max-file: "3"
    max-size: 50m

services:
  pb:
    build: ./pb
    image: fitundfun-webseite-pb
    container_name: fitundfun-pb
    restart: unless-stopped
    logging: *logging
    # Nur für den Cloudflare Tunnel (cloudflared im Docker-Netz «bridge», Ziel 172.17.0.1) und für
    # Prüfungen auf dem Server (127.0.0.1); nicht im Heimnetz. Ohne direkten Zugang ist die
    # Client-IP aus CF-Connecting-IP verlässlich.
    # ponytail: Linux nimmt Pakete für jede eigene IP an; ein Gerät im Heimnetz mit einer von Hand
    # gesetzten Route nach 172.17.0.0/16 käme noch durch. Ganz dicht: cloudflared in ein gemeinsames
    # Docker-Netz hängen, Ziele auf die Containernamen setzen und ports: entfernen.
    ports:
      - "127.0.0.1:8090:8090"
      - "172.17.0.1:8090:8090"
    volumes:
      # Standard ./pb_data; auf dem Server per PB_DATA_DIR nach ~/docker-data verlegt.
      - ${PB_DATA_DIR:-./pb_data}:/pb/pb_data
    environment:
      TZ: Europe/Zurich
      PB_ORIGINS: ${PB_ORIGINS}
      # Bei bestehenden Installationen optional; eine Neuinstallation bricht
      # ohne diese Werte mit einer klaren Migrationsmeldung ab.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      FAMILY_ACCESS_EMAIL: ${FAMILY_ACCESS_EMAIL:-familie@fitundfun.local}
      FAMILY_ACCESS_SECRET: ${FAMILY_ACCESS_SECRET:?FAMILY_ACCESS_SECRET ist erforderlich}

  web:
    build:
      context: .
      args:
        - NEXT_PUBLIC_PB_URL=${NEXT_PUBLIC_PB_URL}
        - SITE_URL=${SITE_URL}
    image: fitundfun-webseite-web
    container_name: fitundfun-web
    restart: unless-stopped
    logging: *logging
    depends_on:
      - pb
    ports:
      - "127.0.0.1:3843:3000"
      - "172.17.0.1:3843:3000"
    environment:
      NEXT_PUBLIC_PB_URL: ${NEXT_PUBLIC_PB_URL}
      # Serverseitige Aufrufe direkt im Compose-Netz, unabhängig von DNS/HTTPS der öffentlichen URL.
      PB_INTERNAL_URL: http://pb:8090
      SITE_URL: ${SITE_URL}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      FAMILY_ACCESS_EMAIL: ${FAMILY_ACCESS_EMAIL:-familie@fitundfun.local}
      FAMILY_ACCESS_SECRET: ${FAMILY_ACCESS_SECRET:?FAMILY_ACCESS_SECRET ist erforderlich}
      TZ: Europe/Zurich
