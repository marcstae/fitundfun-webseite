<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Vorlage für src/app/icon.png und apple-icon.png (node scripts/favicon.mjs).
       Gezeichnet auf ebenem Boden mit Fahrtrichtung rechts, dann als Ganzes auf den Hang
       gedreht: Ski, Tempolinien und Schnee folgen derselben Neigung. -->
  <g transform="rotate(16 256 300)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Tempolinien hinter dem Fahrer, parallel zur Fahrtrichtung -->
    <g stroke="#0f1e33" stroke-width="14" fill="none">
      <path d="M58 214 H138"/>
      <path d="M34 262 H130"/>
      <path d="M70 310 H136"/>
    </g>
    <!-- Schnee, den das Skiende aufwirbelt -->
    <g fill="#ffffff" stroke="#0f1e33" stroke-width="12">
      <circle cx="58" cy="352" r="18"/>
      <circle cx="88" cy="372" r="22"/>
      <circle cx="46" cy="388" r="13"/>
    </g>
    <!-- Ski mit hochgebogener Spitze vorne -->
    <path d="M76 400 H392 Q434 400 440 366" fill="none" stroke="#0f1e33" stroke-width="36"/>
    <path d="M76 400 H392 Q434 400 440 366" fill="none" stroke="#ff5a36" stroke-width="18"/>
    <!-- Bein: Schuh → Knie (nach vorn) → Hüfte (nach hinten), Hose nachtblau -->
    <path d="M262 350 L318 292 L228 256" fill="none" stroke="#0f1e33" stroke-width="62"/>
    <path d="M262 350 L318 292 L228 256" fill="none" stroke="#1e3a8a" stroke-width="44"/>
    <!-- Schuh steht auf dem Ski -->
    <rect x="224" y="342" width="86" height="42" rx="13" fill="#0f1e33"/>
    <!-- Oberkörper nach vorn gebeugt: Hüfte → Schulter -->
    <path d="M228 256 L286 172" fill="none" stroke="#0f1e33" stroke-width="84"/>
    <path d="M228 256 L286 172" fill="none" stroke="#2563eb" stroke-width="64"/>
    <path d="M240 228 L266 190" fill="none" stroke="#5b8cff" stroke-width="12"/>
    <!-- Kopf mit Helm und Skibrille, Blick in Fahrtrichtung -->
    <circle cx="328" cy="118" r="44" fill="#ffd9b8" stroke="#0f1e33" stroke-width="12"/>
    <path d="M284 120 A44 44 0 0 1 372 120 Z" fill="#ff5a36" stroke="#0f1e33" stroke-width="12"/>
    <rect x="314" y="118" width="66" height="28" rx="13" fill="#0f1e33"/>
    <rect x="334" y="125" width="30" height="9" rx="4.5" fill="#7dd3fc"/>
    <!-- Stock: von der Hand schräg nach vorn, Spitze im Schnee -->
    <path d="M384 230 L400 394" fill="none" stroke="#0f1e33" stroke-width="12"/>
    <path d="M384 376 H414" fill="none" stroke="#0f1e33" stroke-width="9"/>
    <!-- Arm: Schulter → Ellbogen → Hand am Stock -->
    <path d="M292 190 L324 244 L380 232" fill="none" stroke="#0f1e33" stroke-width="46"/>
    <path d="M292 190 L324 244 L380 232" fill="none" stroke="#2563eb" stroke-width="28"/>
    <circle cx="384" cy="232" r="18" fill="#0f1e33"/>
  </g>
</svg>
